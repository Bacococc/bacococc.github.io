# Theme Settings
theme: "minimal-mistakes-jekyll"
minimal_mistakes_skin: "dirt"

# Site Settings
locale: "ko-KR"
title: "Hyojin Park"
title_separator: "-"
subtitle: "매일매일 성장"
name: "Hyojin Park"
description: "Developer Blog"
url: "https://bacococc.github.io"
repository: "bacococc/bacococc.github.io"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true